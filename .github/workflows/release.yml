name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Release Mr9 `${{ github.ref_name }}`.

            ## Checklist
            - [ ] CI verde na tag
            - [ ] Notas de migração / wizard revisadas
            - [ ] Sem secrets no artefato
