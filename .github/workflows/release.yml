name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Release Mr9 `${{ github.ref_name }}`.

            Consulte o changelog e as instruções de instalação antes de atualizar.
