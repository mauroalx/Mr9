services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mr9
      POSTGRES_USER: mr9
      POSTGRES_PASSWORD: ${MR9_POSTGRES_PASSWORD:?execute ./scripts/bootstrap.sh}
    volumes:
      - mr9_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mr9 -d mr9"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./apps/api
    environment:
      MR9_SECRET_KEY: ${MR9_SECRET_KEY:?execute ./scripts/bootstrap.sh}
      MR9_ENVIRONMENT: production
      MR9_DATABASE_URL: postgresql+psycopg://mr9:${MR9_POSTGRES_PASSWORD:?execute ./scripts/bootstrap.sh}@postgres:5432/mr9
      MR9_CORS_ORIGINS: ${MR9_CORS_ORIGINS:?defina a origem HTTPS do Mr9}
      MR9_FIRMWARE_STORAGE_DIR: /var/lib/mr9/firmwares
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - mr9_firmwares:/var/lib/mr9/firmwares
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  mr9_pg:
  mr9_firmwares:
