[project]
name = "mr9-api"
version = "0.1.0"
description = "Mr9 — micro-ACS API"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.6",
  "psycopg[binary]==3.3.6",
  "alembic==1.20.1",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "httpx==0.28.1",
  "cryptography==50.0.2",
  "passlib[argon2]==1.7.4",
  "python-jose[cryptography]==3.5.0",
  "python-multipart==0.0.33",
  "email-validator==2.3.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1", "ruff==0.17.3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# `Depends(...)` em defaults é a assinatura declarativa esperada pelo FastAPI.
ignore = ["B008"]
